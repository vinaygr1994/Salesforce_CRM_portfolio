<style>
.gauge{display:flex;gap:6px;margin:0 0 18px}
.gauge i{flex:1;height:8px;border-radius:4px;background:#E7E0D3}
.gauge i.on{background:var(--clay)}
.gauge.good i.on{background:#4A7C59}
.gauge.mid i.on{background:#B8863F}
.score{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.score b{font:400 26px/1.2 Georgia,serif;color:var(--green)}
.score span{font:700 11px/1 Arial,sans-serif;letter-spacing:1.6px;color:var(--muted);white-space:nowrap}
ol.fix{list-style:none;margin:16px 0 0;padding:0;counter-reset:f}
ol.fix li{counter-increment:f;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
ol.fix li::before{content:counter(f);width:28px;height:28px;border-radius:50%;background:var(--sage);color:var(--green);font:700 13px/28px Arial,sans-serif;text-align:center}
ol.fix b{display:block}
ol.fix span{color:var(--muted);font-size:14.5px}
.tpl{margin-top:20px;background:var(--sage);border-radius:12px;padding:18px}
.tpl p.k{font:700 11px/16px Arial,sans-serif;letter-spacing:1.8px;color:var(--green);margin:0 0 8px}
.tpl blockquote{margin:0 0 14px;background:#fff;border-radius:14px 14px 14px 4px;padding:14px 16px;font-size:15.5px;line-height:1.5}
.tpl button{all:unset;cursor:pointer;background:var(--green);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:6px}
.fields{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.fields span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13.5px;font-weight:600}
.fields span i{font-style:normal;color:var(--clay)}
</style></head>
