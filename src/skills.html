<section id="skills" class="sk">
  <div class="wrap">
    <p class="kicker">See it work</p>
    <h2>Five things your CRM should do while you're on site.</h2>
    <p class="lead">Tap a skill. Each one plays the way it runs for a real remodeler, start to finish.</p>
    <div class="sk-tabs" role="tablist" aria-label="Skills" id="skTabs"></div>
    <div class="sk-stage">
      <div class="sk-visual" id="skVisual">
        <img id="skImg" src="img/site/sk-speed.jpg" alt="" width="720" height="900" loading="lazy">
        <div class="sk-shade" id="skShade"></div>
        <span class="sk-chip" id="skChip"><i></i><b></b></span>
        <div class="sk-anim" id="skAnim" aria-hidden="true"></div>
      </div>
      <div class="sk-copy" aria-live="polite">
        <p class="sk-k" id="skK"></p>
        <h3 id="skH"></h3>
        <ul class="sk-list" id="skL"></ul>
        <div class="sk-acts">
          <a class="btn btn-o" href="#demo">Try it in the live demo &rarr;</a>
          <button type="button" class="sk-replay" id="skReplay">&#8635; Replay</button>
        </div>
        <div class="sk-prog" aria-hidden="true"><i id="skBar"></i></div>
      </div>
    </div>
  </div>
</section>
